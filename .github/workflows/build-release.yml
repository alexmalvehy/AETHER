name: Build & Publish Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag override (defaults to v<versionName> from app/build.gradle.kts)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.AETHER_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "${{ runner.temp }}/aether-release.jks"

      - name: Build signed release APK
        env:
          AETHER_KEYSTORE_FILE: ${{ runner.temp }}/aether-release.jks
          AETHER_KEYSTORE_PASSWORD: ${{ secrets.AETHER_KEYSTORE_PASSWORD }}
          AETHER_KEY_ALIAS: ${{ secrets.AETHER_KEY_ALIAS }}
          AETHER_KEY_PASSWORD: ${{ secrets.AETHER_KEY_PASSWORD }}
        run: |
          bash ./gradlew :app:assembleRelease --no-daemon

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi
          APK="AETHER-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          echo "Built $APK (SHA-256: $SHA256)"

          if ! gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              -R "${{ github.repository }}" \
              --target main \
              --title "AETHER ${VERSION} (Fork)" \
              --notes "Build automàtica signada amb la clau persistent de la fork.\n\n**${APK}** · SHA-256: \`${SHA256}\`"
          fi
          gh release upload "$TAG" "$APK" --clobber -R "${{ github.repository }}"

      - name: Clean up keystore
        if: always()
        run: rm -f "${{ runner.temp }}/aether-release.jks"
